.nav a{display:block;padding:8px 11px;border-radius:99px;text-decoration:none;color:var(--ink);font-size:.94rem;font-weight:500;transition:background .2s}
.nav a:hover{background:var(--mist)}.nav a[aria-current=page]{background:var(--green);color:#fff}

.ev{display:grid;grid-template-columns:150px 1fr auto;gap:24px;align-items:center;padding:26px 0;border-bottom:1px solid var(--line)}
.date{font:600 1.1rem var(--serif);color:var(--green);border-left:4px solid var(--gold);padding-left:14px}

.rep-links{list-style:none;padding:18px 0 0;margin:auto 0 0;border-top:1px solid var(--line);display:grid;gap:10px}
.rep-links a,.rep-links span{display:flex;gap:12px;align-items:center;text-decoration:none;font-weight:600;padding:11px 14px;border-radius:12px;background:var(--mist);overflow-wrap:anywhere;transition:background .2s}
.rep-links a:hover{background:var(--green);color:#fff}.rep-links a:hover svg{stroke:var(--gold-l)}

label{display:block;font-weight:600;font-size:.95rem;margin-bottom:4px}
input,select,textarea{width:100%;padding:14px 15px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font:inherit;color:var(--ink);margin-bottom:18px}

.site-footer{background:var(--deep);color:#d3e1d9;padding:60px 0 28px;font-size:.97rem}

const demo = '<p class="demo">Contenu d’exemple : remplacez-le dans la section CONTENUS MODIFIABLES du fichier par des informations vérifiées avant publication.</p>';
const head = (t, s) => `<section class="page-head"><div class="wrap"><h1>${t}</h1><p>${s}</p></div></section>`;
const share = t => { const u = encodeURIComponent(location.href); return `<div class="share"><a href="https://wa.me/?text=${encodeURIComponent(t)}%20${u}" target="_blank" rel="noopener">Partager sur WhatsApp</a><a href="https://www.facebook.com/sharer/sharer.php?u=${u}" target="_blank" rel="noopener">Facebook</a></div>`; };
const tiktok = (cls) => C.tiktokUrl
  ? `<a href="${esc(C.tiktokUrl)}" target="_blank" rel="noopener">${cls ? svg("tiktok") : ""}TikTok : ${esc(C.tiktok)}</a>`
  : (cls ? `<span>${svg("tiktok")}TikTok : ${esc(C.tiktok)}</span>` : `TikTok : ${esc(C.tiktok)}`);
const repLinks = p => `<ul class="rep-links"><li><a href="tel:${esc(p.tel.replace(/\s/g, ""))}">${svg("phone")}${esc(p.tel)}</a></li><li><a href="mailto:${esc(p.email)}">${svg("mail")}${esc(p.email)}</a></li></ul>`;

const PAGES = [
  ["", "Accueil"], ["a-propos", "À propos"], ["activites", "Activités"], ["evenements", "Événements"],
  ["ressources", "Ressources"], ["equipe", "Équipe"], ["representants", "Représentants"], ["contact", "Contact"]
];

const V = {
  "": () => `
<section class="hero">
  <div class="sunwrap" aria-hidden="true"><svg viewBox="0 0 600 340">
    <g class="sun">
      <g class="ray" stroke="#EBD79B" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"><path d="M300 300V120M300 300L172 172M300 300L428 172M300 300H120M300 300H480"/></g>
      <circle cx="300" cy="300" r="120" fill="#C8A24A"/><circle cx="300" cy="300" r="170" fill="none" stroke="#EBD79B" stroke-opacity=".5" stroke-width="2"/><circle cx="300" cy="300" r="230" fill="none" stroke="#EBD79B" stroke-opacity=".25" stroke-width="2"/>
    </g>
    <path d="M0 340V290c120-30 220-10 300 12s200 30 300-8v46z" fill="#0A3629"/>
    <path d="M300 340c-6-40 20-60 60-80" stroke="#EBD79B" stroke-width="3" fill="none" stroke-dasharray="2 10" stroke-linecap="round"/>
  </svg></div>
  <div class="wrap">
    <h1>Sunu Avenir</h1>
    <p class="tag">Ensemble, préparons des rencontres qui orientent la jeunesse.</p>
    <p class="motto">Échanger <i></i> Planifier <i></i> Agir.</p>
    <a class="btn btn-gold" href="#/a-propos">Découvrir notre initiative</a>
    <a class="btn btn-line" href="#/evenements">Participer à nos rencontres</a>
  </div>
</section>
<section class="sec"><div class="wrap split">
  <div><h2>Des jeunes qui aident des jeunes</h2></div>
  <div>
    <p class="lead">Sunu Avenir est née du désir d’étudiants de Richard Toll de partager ce qu’ils auraient aimé savoir plus tôt. 💚🎓</p>
    <p>Nous organisons des rencontres d’orientation, partageons des informations utiles et créons des espaces d’entraide, sans but lucratif.</p>
    <a href="#/a-propos"><b>Lire notre histoire</b></a>
  </div>
</div></section>
<section class="sec alt"><div class="wrap"><div class="values">
  <div><h3>Solidarité</h3><p>Nous avançons ensemble, sans chercher de gain personnel.</p></div>
  <div><h3>Orientation</h3><p>Nous aidons à faire des choix éclairés pour les études.</p></div>
  <div><h3>Partage</h3><p>Informations, expériences et opportunités circulent librement.</p></div>
  <div><h3>Engagement</h3><p>Nous agissons pour l’avenir de notre communauté.</p></div>
</div></div></section>
<section class="sec"><div class="wrap">
  <h2>Comment nous avançons</h2>
  <p class="lead">Trois mots pour une même démarche.</p>
  <div class="steps">
    <div class="step"><b>1</b><h3>Échanger</h3><p>Nous partageons nos expériences et nous écoutons vos questions.</p></div>
    <div class="step"><b>2</b><h3>Planifier</h3><p>Nous préparons des rencontres utiles, avec des étudiants et des professionnels.</p></div>
    <div class="step"><b>3</b><h3>Agir</h3><p>Nous passons à l’action : rencontres, ressources et entraide.</p></div>
  </div>
</div></section>
<section class="sec manifest"><div class="wrap">
  <blockquote>L’avenir se construit ensemble. En partageant les informations, les expériences et les opportunités, nous pouvons aider chaque jeune à avancer avec plus de confiance.</blockquote>
  <p>Pour la jeunesse de Richard Toll, par la jeunesse de Richard Toll.</p>
</div></section>
<section class="sec"><div class="wrap"><div class="cta">
  <div><h2>Rejoignez la prochaine rencontre</h2><p>Consultez les événements à venir ou écrivez-nous : toute question est la bienvenue.</p></div>
  <div><a class="btn btn-gold" href="#/evenements">Voir les événements</a><a class="btn btn-line" href="#/contact">Nous écrire</a></div>
</div></div></section>`,

  "a-propos": () => head("À propos", "Une initiative de jeunes, pour les jeunes.") + `
<section class="sec"><div class="wrap story">
  <h2>Notre histoire</h2>
  <p class="first">Sunu Avenir est née du désir d’étudiants de Richard Toll de partager ce qu’ils auraient aimé savoir plus tôt. 💚🎓</p>
  <div class="story-cols">
    <p>À travers cette initiative, nous souhaitons mettre en commun nos expériences, partager des informations utiles et créer des opportunités d’échange et d’entraide entre jeunes.</p>
    <p>Notre objectif est d’aider nos petits frères, nos petites sœurs et nos camarades à mieux s’informer, à découvrir de nouvelles possibilités et à avancer plus sereinement dans leurs parcours scolaires, universitaires et professionnels.</p>
    <p>Nous ne prétendons pas tout savoir. Nous croyons simplement qu’en partageant ce que nous apprenons, en nous écoutant et en nous soutenant mutuellement, nous pouvons être utiles à notre communauté.</p>
    <p>Sunu Avenir, c’est une initiative collective, portée par la volonté d’apprendre, de partager et d’avancer ensemble.</p>
  </div>
  <p class="sign">Parce que nous avons tous quelque chose à apprendre et quelque chose à apporter.<br><span>💚 Sunu Avenir : Ensemble, préparons notre avenir. 🤝🏽🎓</span></p>
</div></section>
<section class="sec alt"><div class="wrap values three">
  <div><h3>Notre vision</h3><p>Une jeunesse informée, confiante et solidaire, capable de construire son avenir.</p></div>
  <div><h3>Notre mission</h3><p>Créer des espaces d’échange et de partage d’expériences, en cherchant ensemble plutôt qu’en prétendant tout savoir.</p></div>
  <div><h3>Nos objectifs</h3><p>Organiser des rencontres régulières, diffuser des informations vérifiées, encourager l’entraide et nous ouvrir aux jeunes de tout le Sénégal.</p></div>
</div></section>`,

  "activites": () => head("Nos activités", "Six façons de s’orienter et d’avancer ensemble.") +
    `<section class="sec"><div class="wrap">${D.activites.map(([i, t, p]) => `<article class="act"><div class="ico">${svg(i)}</div><div><h3>${t}</h3><p>${p}</p></div></article>`).join("")}</div></section>`,

  "evenements": () => {
    const ev = e => `<article class="ev"><div class="date">${esc(e.date)}<br><small>${esc(e.heure)}</small></div><div><span class="pill">${esc(e.format)}</span><h3>${esc(e.titre)}</h3><p>${esc(e.description)}</p><p><small>${esc(e.intervenants)}</small></p>${share(e.titre)}</div><div>${e.archive ? "" : `<a class="btn btn-green" href="${esc(e.lien || "#/contact")}">S’inscrire</a>`}</div></article>`;
    const list = a => D.evenements.filter(e => e.archive === a).map(ev).join("") || "<p>Aucun événement pour le moment.</p>";
    return head("Événements", "Les prochaines rencontres et celles que vous avez manquées.") +
      `<section class="sec"><div class="wrap">${demo}<h2>À venir</h2>${list(false)}<h2 style="margin-top:56px">Archives</h2>${list(true)}</div></section>`;
  },

  "ressources": () => {
    const cats = [...new Set(D.ressources.map(r => r.cat))];
    return head("Ressources", "Guides, concours et filières, classés et sourcés.") +
      `<section class="sec"><div class="wrap">${demo}<div class="filters"><div><label for="q">Rechercher</label><input id="q" type="search" placeholder="Concours, filière, guide…"></div><div><label for="c">Catégorie</label><select id="c"><option value="">Toutes</option>${cats.map(c => `<option>${esc(c)}</option>`).join("")}</select></div></div><div class="res" id="rl" aria-live="polite"></div></div></section>`;
  },

  "equipe": () => head("Notre équipe", "Des bénévoles qui donnent de leur temps, avec leur accord.") +
    `<section class="sec"><div class="wrap"><p class="lead">Sunu Avenir est portée par toute une équipe. Hamet Dia et Aliou Ba la représentent sur ce site : <a href="#/representants">voir nos représentants</a>.</p>${demo}<div class="team">${D.equipe.map(m => `<article><div class="avatar">${m.photo ? `<img src="${esc(m.photo)}" alt="${esc(m.nom)}" loading="lazy">` : esc(m.nom[0])}</div><h3>${esc(m.nom)}</h3><p><b>${esc(m.fonction)}</b></p><p>${esc(m.bio)}</p></article>`).join("")}</div></div></section>`,

  "representants": () => head("Nos représentants", "Deux visages pour Sunu Avenir, une équipe entière derrière.") + `
<section class="sec"><div class="wrap">
  <div class="note"><div class="ico">${svg("hands")}</div><div>
    <h2>Deux représentants, pas les seuls membres</h2>
    <p>Sunu Avenir est une initiative collective, portée par toute une équipe de jeunes. Hamet Dia et Aliou Ba ont été choisis pour la représenter sur ce site : ils ne sont pas les seuls membres du projet. Le travail de chacun compte. <a href="#/equipe">Découvrir l’équipe</a></p>
  </div></div>
  <div class="reps">${D.representants.map(p => `<article class="rep">
    <div class="avatar">${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(p.nom)}" loading="lazy">` : esc(p.nom[0])}</div>
    <span class="pill">Représentant de Sunu Avenir</span>
    <h3>${esc(p.nom)}</h3>
    <p class="study">${svg("school")}<span><b>${esc(p.etudes)}</b><br>${esc(p.lieu)}</span></p>
    <p>${esc(p.texte)}</p>
    ${p.citation ? `<blockquote>« ${esc(p.citation)} »</blockquote>` : ""}
    ${repLinks(p)}</article>`).join("")}</div>
</div></section>`,

  "contact": () => head("Contact", "Une question, une inscription, une proposition ? Écrivez-nous.") + `
<section class="sec"><div class="wrap contact-grid">
  <form id="contact-form" novalidate>
    <label for="nom">Nom</label><input id="nom" name="nom" autocomplete="name" required>
    <label for="contact">E-mail ou téléphone (pour vous répondre)</label><input id="contact" name="contact" autocomplete="email">
    <label for="sujet">Sujet</label>
    <select id="sujet" name="sujet"><option>Question générale</option><option>Inscription à une rencontre</option><option>Devenir intervenant</option><option>Partenariat</option></select>
    <label for="message">Message</label><textarea id="message" name="message" rows="6" required></textarea>
    <input type="text" name="_honey" tabindex="-1" autocomplete="off" style="display:none">
    <p><small>Vos données servent uniquement à vous répondre. Ne partagez que le nécessaire.</small></p>
    <button class="btn btn-green" type="submit">Envoyer le message</button>
    <p class="status" id="status" role="status"></p>
  </form>
  <aside class="coords">
    <h2>Nos coordonnées</h2>
    <div class="coord"><h3>Sunu Avenir</h3><ul class="rep-links">
      <li><a href="mailto:${esc(C.email)}">${svg("mail")}${esc(C.email)}</a></li>
      <li>${tiktok(true)}</li>
    </ul></div>
    <p>Sunu Avenir est portée par toute une équipe. Voici ses deux représentants :</p>
    ${D.representants.map(p => `<div class="coord"><h3>${esc(p.nom)}</h3>${repLinks(p)}</div>`).join("")}
  </aside>
</div></section>`
};

/* Comportements propres à certaines pages */
const AFTER = {
  ressources() {
    const draw = () => {
      const q = $("#q").value.toLowerCase(), c = $("#c").value;
      const r = D.ressources.filter(x => (!c || x.cat === c) && Object.values(x).join(" ").toLowerCase().includes(q));
      $("#rl").innerHTML = r.map(x => `<article class="card"><span class="pill">${esc(x.cat)}</span><h3>${esc(x.titre)}</h3><p>${esc(x.texte)}</p>${x.lien ? `<p><a href="${esc(x.lien)}" rel="noopener">Consulter la source officielle</a></p>` : ""}<small>${esc(x.source)} · ${esc(x.maj)}</small></article>`).join("") || "<p>Aucun résultat. Essayez un autre mot-clé.</p>";
    };
    $("#q").addEventListener("input", draw); $("#c").addEventListener("change", draw); draw();
  },
  contact() {
    const form = $("#contact-form"), st = $("#status"), btn = form.querySelector("button");
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const f = new FormData(form);
      if (f.get("_honey")) return;
      if (!f.get("nom").trim() || !f.get("message").trim()) { st.textContent = "Renseignez votre nom et votre message pour envoyer."; return; }
      btn.disabled = true; st.textContent = "Envoi en cours…";
      const contact = (f.get("contact") || "").trim();
      const body = { nom: f.get("nom"), contact: contact || "non renseigné", message: f.get("message"), _subject: "[Sunu Avenir] " + f.get("sujet"), _cc: C.cc, _template: "table", _captcha: "false" };
      if (contact.includes("@")) body.email = contact;
      try {
        const res = await fetch("https://formsubmit.co/ajax/" + C.email, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(body) });
        const data = await res.json();
        if (!res.ok || data.success === "false" || data.success === false) throw new Error();
        form.reset();
        st.textContent = "Merci ! Votre message a bien été envoyé. Nous vous répondrons dès que possible.";
      } catch {
        st.innerHTML = "L’envoi a échoué. Écrivez-nous directement à <a href=\"mailto:" + esc(C.email) + "\">" + esc(C.email) + "</a>.";
      } finally { btn.disabled = false; }
    });
  }
};

/* Menu, pied de page et routage */
$("#menu").innerHTML = PAGES.map(([h, t]) => `<li><a href="#/${h}" data-p="${h}">${t}</a></li>`).join("");
$("#footmenu").innerHTML = PAGES.map(([h, t]) => `<li><a href="#/${h}">${t}</a></li>`).join("");
const soc = [C.email && `<a href="mailto:${esc(C.email)}">${esc(C.email)}</a>`, C.tiktok && tiktok(false), C.facebook && `<a href="${esc(C.facebook)}">Facebook</a>`, C.instagram && `<a href="${esc(C.instagram)}">Instagram</a>`, C.whatsapp && `<a href="https://wa.me/${esc(C.whatsapp)}">WhatsApp</a>`].filter(Boolean);
$("#footcontact").innerHTML = soc.join("<br>");
$("#year").textContent = new Date().getFullYear();
const burger = $("#burger"), nav = $("#nav");
burger.addEventListener("click", () => burger.setAttribute("aria-expanded", nav.classList.toggle("open")));

function route() {
  const raw = location.hash.replace(/^#\/?/, "");
  const k = Object.prototype.hasOwnProperty.call(V, raw) ? raw : "";
  $("#main").innerHTML = V[k]();
  document.querySelectorAll("#menu a").forEach(a => a.dataset.p === k ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  nav.classList.remove("open"); burger.setAttribute("aria-expanded", "false");
  document.title = (k ? PAGES.find(p => p[0] === k)[1] + " | " : "") + "Sunu Avenir";
  window.scrollTo(0, 0);
  if (AFTER[k]) AFTER[k]();
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
